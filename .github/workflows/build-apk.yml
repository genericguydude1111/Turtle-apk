name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-apk:
    name: Build Android APK (debug)
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            autoconf automake libtool libtool-bin pkg-config m4 build-essential \
            libffi-dev libssl-dev \
            git zip unzip \
            libsqlite3-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libbz2-dev liblzma-dev \
            cmake ccache

      - name: Cache ~/.buildozer (global Buildozer home)
        uses: actions/cache@v5
        with:
          path: ~/.buildozer
          key: buildozer-home-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-home-${{ runner.os }}-

      - name: Cache .buildozer (local build cache)
        uses: actions/cache@v5
        with:
          path: .buildozer
          key: buildozer-local-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-local-${{ runner.os }}-

      - name: Install Python build tools
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK (debug)
        timeout-minutes: 45
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: turtle-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30
