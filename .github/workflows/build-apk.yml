name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jdk python3-pip git zip unzip
          pip install buildozer cython
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: turtle-apk
          path: bin/*.apk
